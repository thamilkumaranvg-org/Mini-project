<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Login | Farmer Slot Booking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

  <header class="app-header">
    <div class="header-container">
      <a href="/" class="brand">
        <span class="brand-icon">🌾</span>
        <div class="brand-text">
          <h1>Farmer Slot Booking</h1>
          <span>Farmer Portal</span>
        </div>
      </a>
      <div class="header-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/register.html" class="nav-link">Register</a>
      </div>
    </div>
  </header>

  <main style="display:flex;align-items:center;justify-content:center;padding:40px 16px;">
    <div class="card" style="max-width:440px;width:100%;margin:0 auto;box-shadow:var(--shadow);">
      <div style="text-align:center;margin-bottom:24px;">
        <div style="font-size:2.8rem;margin-bottom:8px;">👨‍🌾</div>
        <h2 style="color:var(--green-900);font-size:1.5rem;">Farmer Sign In</h2>
        <p style="color:var(--muted);font-size:0.95rem;">Enter your registered credentials to access your selling slots</p>
      </div>

      <div id="login-error" class="form-error" style="display:none;background:#FFEBEE;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid #FFCDD2;margin-bottom:16px;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" required placeholder="farmer@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:24px;">
          Sign In
        </button>
      </form>

      <div style="text-align:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--border-light);font-size:0.95rem;">
        Don't have an account? <a href="/register.html">Register as a New Farmer</a>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    Farmer Slot Booking System • Ministry of Agriculture & Farmer Welfare
  </footer>

  <script type="module">
    import { apiRequest } from "/js/api.js";
    import { showToast } from "/js/ui.js";

    const form = document.getElementById("login-form");
    const errBox = document.getElementById("login-error");
    const submitBtn = document.getElementById("submit-btn");

    form.onsubmit = async (e) => {
      e.preventDefault();
      errBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing In...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await apiRequest("/api/auth/login", {
          method: "POST",
          body: { email, password, portal: "customer" }
        });
        showToast("Welcome back!", "success");
        window.location.href = "/customer/slots.html";
      } catch (err) {
        errBox.textContent = err.message || "Invalid email or password.";
        errBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    };
  </script>

</body>
</html>
